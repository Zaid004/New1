// ── BAR CHART ─────────────────────────────────────────────────────────────────
function BarChart({data}) {
  const max = Math.max(...data.map(d=>d.value), 1);
  const H = 80;
  return (
    <div className="flex items-end justify-center gap-4 pt-2" style={{height: H+48}}>
      {data.map((d,i)=>(
        <div key={i} className="flex flex-col items-center gap-1.5">
          <div className="text-xs font-black" style={{color:d.color}}>{d.value}</div>
          <div className="w-14 rounded-t-xl transition-all duration-500"
            style={{height: Math.max((d.value/max)*H,4), background:d.color}}/>
          <div className="text-xs font-semibold text-center leading-tight" style={{color:C.txt,opacity:.6,maxWidth:56}}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}

// ── SETTINGS SECTION (inside EmployeesView) ───────────────────────────────────
function SettingsSection({settings, onSaved}) {
  const [pool, setPool] = useState(String(settings?.monthly_pool_amount||525000));
  const [pct,  setPct]  = useState(String(settings?.monthly_percentage||3.2));
  const [net,  setNet]  = useState(settings?.allowed_network||'');
  const [lat,  setLat]  = useState(settings?.library_lat!=null?String(settings.library_lat):'');
  const [lng,  setLng]  = useState(settings?.library_lng!=null?String(settings.library_lng):'');
  const [radius, setRadius] = useState(String(settings?.location_radius||100));
  const [gpsLoading, setGpsLoading] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg,  setMsg]  = useState({text:'',ok:true});
  const flash = (text,ok=true)=>{setMsg({text,ok});setTimeout(()=>setMsg({text:'',ok:true}),3000);};

  const useMyLocation = () => {
    if (!navigator.geolocation) { flash('المتصفح لا يدعم GPS', false); return; }
    setGpsLoading(true);
    navigator.geolocation.getCurrentPosition(
      pos => {
        setLat(String(pos.coords.latitude));
        setLng(String(pos.coords.longitude));
        setGpsLoading(false);
        flash('تم تحديد موقعك الحالي — لا تنسَ الحفظ');
      },
      err => {
        setGpsLoading(false);
        flash(err.code===1?'يرجى السماح بالوصول للموقع':'تعذّر تحديد الموقع', false);
      },
      {enableHighAccuracy:true, timeout:10000, maximumAge:0}
    );
  };

  const save = async () => {
    setBusy(true);
    const updates = {
      monthly_pool_amount: parseFloat(parseNum(pool))||525000,
      monthly_percentage: parseFloat(pct)||3.2,
      allowed_network: net.trim(),
      library_lat: lat.trim()!==''?parseFloat(lat):null,
      library_lng: lng.trim()!==''?parseFloat(lng):null,
      location_radius: parseInt(radius)||100,
    };
    const {error} = await sb.from('settings').update(updates).eq('id', settings.id);
    setBusy(false);
    if(error){flash(error.message,false);return;}
    flash('تم حفظ الإعدادات');
    if(onSaved) onSaved();
  };

  return (
    <div className="rounded-2xl p-5 shadow-sm space-y-4" style={{background:C.card}}>
      <h3 className="font-bold" style={{color:C.txt}}>إعدادات الراتب</h3>
      <div>
        <label className="text-xs font-semibold block mb-1" style={{color:C.txt}}>المجموع الشهري (د.ع)</label>
        <input type="text" inputMode="numeric" value={fmtNum(pool)} onChange={e=>setPool(parseNum(e.target.value))}
          className="w-full p-3 rounded-xl border text-sm outline-none"
          style={{borderColor:C.border,background:'var(--input-bg)',color:C.txt}} placeholder="525,000"/>
      </div>
      <div>
        <label className="text-xs font-semibold block mb-1" style={{color:C.txt}}>نسبة المبيعات (%)</label>
        <input type="number" step="0.1" value={pct} onChange={e=>setPct(e.target.value)}
          className="w-full p-3 rounded-xl border text-sm outline-none"
          style={{borderColor:C.border,background:'var(--input-bg)',color:C.txt}} placeholder="3.2"/>
      </div>
      <div>
        <label className="text-xs font-semibold block mb-1" style={{color:C.txt}}>IP المكتبة العام</label>
        <input type="text" value={net} onChange={e=>setNet(e.target.value)}
          className="w-full p-3 rounded-xl border text-sm outline-none"
          style={{borderColor:C.border,background:'var(--input-bg)',color:C.txt}}
          placeholder="مثال: 87.100.25.4 — اتركه فارغاً لإلغاء التقييد"/>
        <p className="text-xs mt-1" style={{color:C.txt,opacity:.45}}>اكتشف IP المكتبة من whatismyip.com أثناء اتصالك بشبكتها · الموظف لن يستطيع تسجيل الحضور خارجها</p>
      </div>

      <div className="pt-2 border-t" style={{borderColor:C.border}}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-sm" style={{color:C.txt}}>موقع المكتبة (GPS)</h3>
          <button onClick={useMyLocation} disabled={gpsLoading}
            className="text-xs font-bold px-3 py-1.5 rounded-xl"
            style={{background:C.soft,color:C.primary}}>
            {gpsLoading?'جاري التحديد...':'استخدم موقعي الحالي'}
          </button>
        </div>
        <div className="flex gap-2 mb-2">
          <div className="flex-1">
            <label className="text-xs font-semibold block mb-1" style={{color:C.txt,opacity:.7}}>خط العرض (Lat)</label>
            <input type="number" step="any" value={lat} onChange={e=>setLat(e.target.value)}
              className="w-full p-3 rounded-xl border text-sm outline-none"
              style={{borderColor:C.border,background:'var(--input-bg)',color:C.txt}} placeholder="33.3152"/>
          </div>
          <div className="flex-1">
            <label className="text-xs font-semibold block mb-1" style={{color:C.txt,opacity:.7}}>خط الطول (Lng)</label>
            <input type="number" step="any" value={lng} onChange={e=>setLng(e.target.value)}
              className="w-full p-3 rounded-xl border text-sm outline-none"
              style={{borderColor:C.border,background:'var(--input-bg)',color:C.txt}} placeholder="44.3661"/>
          </div>
        </div>
        <div>
          <label className="text-xs font-semibold block mb-1" style={{color:C.txt,opacity:.7}}>النطاق المسموح (متر)</label>
          <input type="number" min="10" max="5000" value={radius} onChange={e=>setRadius(e.target.value)}
            className="w-full p-3 rounded-xl border text-sm outline-none"
            style={{borderColor:C.border,background:'var(--input-bg)',color:C.txt}} placeholder="100"/>
        </div>
        <p className="text-xs mt-1.5" style={{color:C.txt,opacity:.45}}>
          {lat&&lng?`الموقع محدد — نطاق ${radius||100} م · اترك الحقول فارغة لإلغاء التقييد`:'اترك فارغاً لإلغاء التقييد بالموقع'}
        </p>
      </div>

      {msg.text && <div className="p-3 rounded-xl text-sm text-center text-white" style={{background:msg.ok?C.ok:C.err}}>{msg.text}</div>}
      <button onClick={save} disabled={busy}
        className="w-full py-3 rounded-xl font-bold text-white"
        style={{background:busy?'#999':C.primary}}>
        {busy?'جاري الحفظ...':'حفظ الإعدادات'}
      </button>
    </div>
  );
}

// ── EMPLOYEES MANAGEMENT (ADMIN) ─────────────────────────────────────────────
function EmployeesView({employees, settings, onRefresh}) {
  const COLORS = ['#6B5876','#A8825B','#7A8B6F','#B0594F','#5876A8','#8B6F7A'];
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({name:'',username:'',password:'',color_hex:'#A8825B',role:'employee',loyverse_pos_name:''});
  const [resetTarget, setResetTarget] = useState(null);
  const [newPass, setNewPass] = useState('');
  const [editTarget, setEditTarget] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState({text:'',ok:true});

  const flash = (text, ok=true) => { setMsg({text,ok}); setTimeout(()=>setMsg({text:'',ok:true}),3000); };

  const addEmployee = async () => {
    if(!form.name.trim()||!form.username.trim()||!form.password) { flash('يرجى تعبئة جميع الحقول',false); return; }
    if(form.password.length<6) { flash('كلمة المرور 6 أحرف على الأقل',false); return; }
    setBusy(true);
    const res = await callFn('create', form);
    setBusy(false);
    if(res.error){ flash(res.error, false); return; }
    flash('تم إضافة الموظف بنجاح');
    setForm({name:'',username:'',password:'',color_hex:'#A8825B',role:'employee',loyverse_pos_name:''});
    setShowAdd(false);
    onRefresh();
  };

  const deleteEmployee = async (emp) => {
    if(!confirm(`حذف ${emp.name}؟ لا يمكن التراجع.`)) return;
    setBusy(true);
    const res = await callFn('delete', {employee_id: emp.id});
    setBusy(false);
    if(res.error){ flash(res.error, false); return; }
    flash('تم الحذف');
    onRefresh();
  };

  const resetPassword = async () => {
    if(!newPass||newPass.length<6){ flash('6 أحرف على الأقل',false); return; }
    setBusy(true);
    const res = await callFn('reset_password', {employee_id: resetTarget.id, new_password: newPass});
    setBusy(false);
    if(res.error){ flash(res.error, false); return; }
    flash('تم تغيير كلمة المرور');
    setResetTarget(null); setNewPass('');
  };

  const openEdit = emp => {
    setEditTarget(emp);
    setEditForm({name: emp.name, username: emp.username||'', color_hex: emp.color_hex, role: emp.role, loyverse_pos_name: emp.loyverse_pos_name||'', avatar_id: emp.avatar_id??null});
  };

  const saveEdit = async () => {
    if(!editForm.name.trim()){ flash('الاسم مطلوب',false); return; }
    setBusy(true);
    const {avatar_id, ...rest} = editForm;
    const res = await callFn('update', {employee_id: editTarget.id, ...rest});
    if(res.error){ setBusy(false); flash(res.error, false); return; }
    await sb.from('employees').update({avatar_id: avatar_id??null}).eq('id', editTarget.id);
    setBusy(false);
    flash('تم تحديث معلومات الموظف');
    setEditTarget(null);
    onRefresh();
  };

  return (
    <div className="space-y-4">
      {msg.text && (
        <div className="p-3 rounded-xl text-sm text-center text-white" style={{background: msg.ok?C.ok:C.err}}>
          {msg.text}
        </div>
      )}

      {/* Employee list */}
      {employees.map(emp => (
        <div key={emp.id} className="rounded-2xl p-4 shadow-sm" style={{background:C.card}}>
          <div className="flex items-center gap-3 mb-3">
            {emp.avatar_id!=null&&AVATARS[emp.avatar_id]?(
              <img src={AVATARS[emp.avatar_id]} className="w-10 h-10 rounded-xl object-cover"
                style={{border:`2px solid ${emp.color_hex}`}}/>
            ):(
              <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold"
                style={{background:emp.color_hex}}>
                {emp.name.charAt(0)}
              </div>
            )}
            <div className="flex-1">
              <div className="font-bold" style={{color:C.txt}}>{emp.name}</div>
              <div className="text-xs" style={{color:C.txt,opacity:.45}}>
                {emp.username ? `@${emp.username}` : ''} · {emp.role==='admin'?'مدير':'موظف'}
                {emp.loyverse_pos_name ? ` · POS: ${emp.loyverse_pos_name}` : ''}
              </div>
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={()=>{setResetTarget(emp);setNewPass('');}}
              className="flex-1 py-2 rounded-xl text-xs font-bold"
              style={{background:C.soft,color:C.txt}}>
              تغيير الباسورد
            </button>
            <button onClick={()=>openEdit(emp)}
              className="py-2 px-3 rounded-xl"
              style={{background:'var(--edit-bg)'}}>
              <Ic n="pencil" s={14} c={C.primary}/>
            </button>
            <button onClick={()=>deleteEmployee(emp)}
              className="py-2 px-3 rounded-xl"
              style={{background:'var(--err-bg)'}}>
              <Ic n="trash" s={14} c={C.err}/>
            </button>
          </div>
        </div>
      ))}

      {/* Add button */}
      <button onClick={()=>setShowAdd(v=>!v)}
        className="w-full p-4 rounded-2xl font-bold text-white flex items-center justify-between"
        style={{background:C.primary}}>
        <span>إضافة موظف جديد</span>
        <Ic n={showAdd?'chL':'chR'} s={18} c="#fff"/>
      </button>

      {/* Add form */}
      {showAdd && (
        <div className="rounded-2xl p-5 shadow-sm space-y-3" style={{background:C.card}}>
          {[['الاسم الكامل','name','text','مثال: أحمد محمد'],['اسم المستخدم للدخول','username','text','مثال: ahmad'],['كلمة المرور','password','password','6 أحرف على الأقل']].map(([l,k,t,ph])=>(
            <div key={k}>
              <label className="text-xs font-semibold block mb-1" style={{color:C.txt}}>{l}</label>
              <input type={t} value={form[k]} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}
                className="w-full p-3 rounded-xl border text-sm outline-none"
                style={{borderColor:C.border,background:'var(--input-bg)'}}
                placeholder={ph} autoCapitalize="none" autoCorrect="off"/>
            </div>
          ))}
          <div>
            <label className="text-xs font-semibold block mb-1" style={{color:C.txt}}>اسم جهاز POS في Loyverse <span style={{opacity:.5}}>(اختياري)</span></label>
            <input type="text" value={form.loyverse_pos_name} onChange={e=>setForm(p=>({...p,loyverse_pos_name:e.target.value}))}
              className="w-full p-3 rounded-xl border text-sm outline-none"
              style={{borderColor:C.border,background:'var(--input-bg)'}}
              placeholder="مثال: Mustafa" autoCapitalize="none" autoCorrect="off"/>
          </div>
          <div>
            <label className="text-xs font-semibold block mb-2" style={{color:C.txt}}>اللون</label>
            <div className="flex gap-2">
              {COLORS.map(col=>(
                <button key={col} onClick={()=>setForm(p=>({...p,color_hex:col}))}
                  className="w-8 h-8 rounded-lg transition-transform"
                  style={{background:col,transform:form.color_hex===col?'scale(1.25)':'scale(1)',outline:form.color_hex===col?`2px solid ${col}`:undefined,outlineOffset:2}}/>
              ))}
            </div>
          </div>
          <div>
            <label className="text-xs font-semibold block mb-1" style={{color:C.txt}}>الصلاحية</label>
            <div className="flex gap-2">
              {[['employee','موظف'],['admin','مدير']].map(([v,l])=>(
                <button key={v} onClick={()=>setForm(p=>({...p,role:v}))}
                  className="flex-1 py-2 rounded-xl text-sm font-bold"
                  style={{background:form.role===v?C.primary:C.soft,color:form.role===v?'#fff':C.txt}}>
                  {l}
                </button>
              ))}
            </div>
          </div>
          <button onClick={addEmployee} disabled={busy}
            className="w-full py-3 rounded-xl font-bold text-white"
            style={{background:busy?'#999':C.ok}}>
            {busy?'جاري الإضافة...':'إضافة الموظف'}
          </button>
        </div>
      )}

      {/* Reset password modal */}
      {resetTarget && (
        <div className="fixed inset-0 z-50 flex items-end justify-center p-4"
          style={{background:'rgba(58,47,61,0.5)'}} onClick={e=>e.target===e.currentTarget&&setResetTarget(null)}>
          <div className="w-full max-w-sm rounded-3xl p-6 shadow-2xl mb-2" style={{background:C.card}}>
            <div className="flex items-center justify-between mb-4">
              <div className="font-bold" style={{color:C.txt}}>تغيير كلمة مرور {resetTarget.name}</div>
              <button onClick={()=>setResetTarget(null)} className="p-2 rounded-xl" style={{background:C.soft}}>
                <Ic n="x" s={16} c={C.txt}/>
              </button>
            </div>
            <input type="password" value={newPass} onChange={e=>setNewPass(e.target.value)}
              className="w-full p-3 rounded-xl border text-sm outline-none mb-3"
              style={{borderColor:C.border}} placeholder="كلمة المرور الجديدة (6 أحرف+)"/>
            <button onClick={resetPassword} disabled={busy}
              className="w-full py-3 rounded-xl font-bold text-white"
              style={{background:busy?'#999':C.primary}}>
              {busy?'جاري...':'حفظ'}
            </button>
          </div>
        </div>
      )}

      {/* Edit employee modal */}
      {editTarget && (
        <div className="fixed inset-0 z-50 flex items-end justify-center p-4"
          style={{background:'rgba(58,47,61,0.5)'}} onClick={e=>e.target===e.currentTarget&&setEditTarget(null)}>
          <div className="w-full max-w-sm rounded-3xl p-6 shadow-2xl mb-2 space-y-4" style={{background:C.card}}>
            <div className="flex items-center justify-between">
              <div className="font-bold" style={{color:C.txt}}>تعديل: {editTarget.name}</div>
              <button onClick={()=>setEditTarget(null)} className="p-2 rounded-xl" style={{background:C.soft}}>
                <Ic n="x" s={16} c={C.txt}/>
              </button>
            </div>
            {[['الاسم الكامل','name','text'],['اسم المستخدم','username','text']].map(([l,k,t])=>(
              <div key={k}>
                <label className="text-xs font-semibold block mb-1" style={{color:C.txt}}>{l}</label>
                <input type={t} value={editForm[k]||''} onChange={e=>setEditForm(p=>({...p,[k]:e.target.value}))}
                  className="w-full p-3 rounded-xl border text-sm outline-none"
                  style={{borderColor:C.border,background:'var(--input-bg)'}}
                  autoCapitalize="none" autoCorrect="off"/>
              </div>
            ))}
            <div>
              <label className="text-xs font-semibold block mb-1" style={{color:C.txt}}>اسم جهاز POS في Loyverse <span style={{opacity:.5}}>(اختياري)</span></label>
              <input type="text" value={editForm.loyverse_pos_name||''} onChange={e=>setEditForm(p=>({...p,loyverse_pos_name:e.target.value}))}
                className="w-full p-3 rounded-xl border text-sm outline-none"
                style={{borderColor:C.border,background:'var(--input-bg)'}}
                placeholder="مثال: Mustafa" autoCapitalize="none" autoCorrect="off"/>
            </div>
            <div>
              <label className="text-xs font-semibold block mb-2" style={{color:C.txt}}>اللون</label>
              <div className="flex gap-2">
                {COLORS.map(col=>(
                  <button key={col} onClick={()=>setEditForm(p=>({...p,color_hex:col}))}
                    className="w-8 h-8 rounded-lg transition-transform"
                    style={{background:col,transform:editForm.color_hex===col?'scale(1.25)':'scale(1)',outline:editForm.color_hex===col?`2px solid ${col}`:undefined,outlineOffset:2}}/>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold block mb-2" style={{color:C.txt}}>صورة الملف الشخصي</label>
              <div className="grid grid-cols-4 gap-2 mb-2">
                <button onClick={()=>setEditForm(p=>({...p,avatar_id:null}))}
                  className="rounded-xl flex items-center justify-center"
                  style={{aspectRatio:'1',background:C.soft,outline:editForm.avatar_id===null?`3px solid ${C.primary}`:undefined,outlineOffset:2}}>
                  <Ic n="x" s={18} c={editForm.avatar_id===null?C.primary:C.txt}/>
                </button>
                {AVATARS.map((src,i)=>(
                  <button key={i} onClick={()=>setEditForm(p=>({...p,avatar_id:i}))}
                    className="rounded-xl overflow-hidden"
                    style={{outline:editForm.avatar_id===i?`3px solid ${C.primary}`:undefined,outlineOffset:2}}>
                    <img src={src} style={{width:'100%',aspectRatio:'1',objectFit:'cover',display:'block'}}/>
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold block mb-1" style={{color:C.txt}}>الصلاحية</label>
              <div className="flex gap-2">
                {[['employee','موظف'],['admin','مدير']].map(([v,l])=>(
                  <button key={v} onClick={()=>setEditForm(p=>({...p,role:v}))}
                    className="flex-1 py-2 rounded-xl text-sm font-bold"
                    style={{background:editForm.role===v?C.primary:C.soft,color:editForm.role===v?'#fff':C.txt}}>
                    {l}
                  </button>
                ))}
              </div>
            </div>
            <div className="text-xs px-1" style={{color:C.txt,opacity:.5}}>
              تغيير اسم المستخدم سيستلزم تسجيل الدخول مجدداً باسم المستخدم الجديد.
            </div>
            <button onClick={saveEdit} disabled={busy}
              className="w-full py-3 rounded-xl font-bold text-white"
              style={{background:busy?'#999':C.ok}}>
              {busy?'جاري الحفظ...':'حفظ التعديلات'}
            </button>
          </div>
        </div>
      )}

      <div className="pt-2">
        <div className="flex items-center gap-2 mb-3 px-1">
          <Ic n="gear" s={16} c={C.primary}/>
          <span className="text-xs font-bold uppercase tracking-widest" style={{color:C.primary}}>إعدادات الراتب</span>
        </div>
        <SettingsSection settings={settings} onSaved={onRefresh}/>
      </div>
    </div>
  );
}

// ── BOXKI MATCH LOG (ADMIN) ───────────────────────────────────────────────────
function BoxkiLogView({employees}) {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');

  useEffect(()=>{
    sb.from('boxki_match_log')
      .select('*')
      .order('matched_at',{ascending:false})
      .limit(200)
      .then(({data})=>{setLogs(data||[]);setLoading(false);});
  },[]);

  const getEmpByAuth = authId => employees.find(e=>e.auth_user_id===authId);

  const fmtTs = iso => {
    const d=new Date(iso);
    return `${d.getDate()} ${MONTHS[d.getMonth()]} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  };

  const fmtPeriod = iso => {
    if(!iso) return '';
    const d=new Date(iso);
    return `${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  };

  const filtered = filter==='all' ? logs : logs.filter(l=>filter==='ok'?l.matched:!l.matched);

  return (
    <div className="space-y-3">
      <div className="flex gap-2">
        {[['all','الكل'],['ok','مطابق ✓'],['fail','فرق ✗']].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)}
            className="flex-1 py-2 rounded-xl text-xs font-bold"
            style={{background:filter===v?C.primary:C.soft,color:filter===v?'#fff':C.txt}}>
            {l}
          </button>
        ))}
      </div>

      {loading && <div className="text-center py-8 text-sm" style={{color:C.txt,opacity:.4}}>جاري التحميل...</div>}
      {!loading && filtered.length===0 && (
        <div className="text-center py-12 text-sm" style={{color:C.txt,opacity:.4}}>لا توجد سجلات بعد</div>
      )}

      <div className="space-y-2">
        {filtered.map((log,i)=>{
          const emp=getEmpByAuth(log.auth_user_id);
          return (
            <div key={i} className="rounded-2xl p-4 shadow-sm" style={{background:C.card}}>
              <div className="flex items-start gap-3">
                {emp && <div className="w-3 h-3 rounded-full flex-shrink-0 mt-1" style={{background:emp.color_hex}}/>}
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between gap-2">
                    <div className="font-semibold text-sm" style={{color:C.txt}}>{emp?.name||'—'}</div>
                    <div className="w-9 h-9 rounded-full flex items-center justify-center font-black text-base flex-shrink-0"
                      style={{background:log.matched?C.ok+'22':'var(--err-bg)',color:log.matched?C.ok:C.err}}>
                      {log.matched?'✓':'✗'}
                    </div>
                  </div>
                  <div className="text-xs mt-1" style={{color:C.txt,opacity:.5}}>{fmtTs(log.matched_at)}</div>
                  <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 mt-2 text-xs" style={{color:C.txt,opacity:.7}}>
                    <span>بوكسي: <strong>{fmt(log.boxki_amount)}</strong> د.ع</span>
                    <span>طلبات: <strong>{log.boxki_orders}</strong></span>
                    <span>Loyverse: <strong>{fmt(log.loyverse_total)}</strong> د.ع</span>
                    <span>طلبات L: <strong>{log.loyverse_orders}</strong></span>
                  </div>
                  {!log.matched && log.diff!==0 && (
                    <div className="mt-1.5 text-xs font-bold" style={{color:C.err}}>
                      فرق: {fmt(Math.abs(log.diff))} د.ع {log.diff>0?'(بوكسي أكثر)':'(Loyverse أكثر)'}
                    </div>
                  )}
                  {log.period_from && (
                    <div className="text-xs mt-1" style={{color:C.txt,opacity:.35}}>
                      {fmtPeriod(log.period_from)} — {fmtPeriod(log.period_to)}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── NOTIFICATION SETTINGS (ADMIN) ─────────────────────────────────────────────
function NotificationSettingsView() {
  const DAYS_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const DEFAULT = {
    reminder_enabled: true,
    reminder_times: ['12:00'],
    reminder_days: [0,1,2,3,4,5],
    reminder_threshold: 1,
    reminder_message: 'عيني شباب شوكت تسجلون حضور؟',
    boxki_notify_enabled: true,
    checkin_notify_enabled: true,
    task_notify_enabled: true,
    task_reminder_enabled: true,
    task_reminder_time: '08:00',
    photo_check_enabled: true,
  };
  const [s, setS] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [quickMsg, setQuickMsg] = useState('');
  const [qBusy, setQBusy] = useState(false);
  const [qSent, setQSent] = useState(false);

  const sendQuick = async () => {
    if(!quickMsg.trim()) return;
    setQBusy(true);
    await sendTelegram(quickMsg.trim());
    setQBusy(false); setQSent(true); setQuickMsg('');
    setTimeout(()=>setQSent(false), 2500);
  };

  useEffect(() => {
    sb.from('notification_settings').select('*').eq('id',1).maybeSingle()
      .then(({data}) => setS(data ? {...DEFAULT,...data} : {...DEFAULT}));
  }, []);

  const upd = patch => setS(prev => ({...prev, ...patch}));

  const save = async () => {
    setSaving(true);
    await sb.from('notification_settings').upsert({...s, id:1});
    setSaving(false); setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const toggleDay = d => {
    const days = s.reminder_days.includes(d)
      ? s.reminder_days.filter(x => x !== d)
      : [...s.reminder_days, d].sort((a,b)=>a-b);
    upd({reminder_days: days});
  };

  const updateTime = (i, v) => {
    const times = [...s.reminder_times]; times[i] = v; upd({reminder_times: times});
  };
  const addTime    = () => upd({reminder_times: [...s.reminder_times, '12:00']});
  const removeTime = i  => upd({reminder_times: s.reminder_times.filter((_,j)=>j!==i)});

  if (!s) return <div className="p-6 text-center" style={{color:C.txt2}}>جار التحميل...</div>;

  const Toggle = ({on, onChange, label}) => (
    <div className="flex items-center justify-between py-2">
      <span className="font-bold text-sm" style={{color:C.txt}}>{label}</span>
      <button onClick={onChange}
        className="w-12 h-6 rounded-full transition-colors relative"
        style={{background: on ? C.ok : C.border}}>
        <span className="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all"
          style={{left: on ? '26px' : '2px'}}/>
      </button>
    </div>
  );

  return (
    <div className="space-y-4 pb-8" style={{direction:'rtl'}}>

      {/* ── تذكير الحضور ── */}
      <div className="rounded-2xl p-4 space-y-3" style={{background:C.card,border:`1px solid ${C.border}`}}>
        <div className="text-base font-bold mb-1" style={{color:C.txt}}>⏰ تذكير الحضور</div>
        <Toggle on={s.reminder_enabled} onChange={()=>upd({reminder_enabled:!s.reminder_enabled})} label="تفعيل التذكير"/>

        {s.reminder_enabled && <>
          {/* أوقات */}
          <div>
            <div className="text-xs mb-2" style={{color:C.txt2}}>أوقات الإرسال</div>
            {s.reminder_times.map((t,i) => (
              <div key={i} className="flex items-center gap-2 mb-2">
                <input type="time" value={t} onChange={e=>updateTime(i,e.target.value)}
                  className="flex-1 p-2 rounded-xl text-sm"
                  style={{background:C.soft,color:C.txt,border:`1px solid ${C.border}`}}/>
                {s.reminder_times.length > 1 &&
                  <button onClick={()=>removeTime(i)}
                    className="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold"
                    style={{background:C.danger+'22',color:C.danger}}>✕</button>}
              </div>
            ))}
            <button onClick={addTime}
              className="text-sm px-3 py-1.5 rounded-xl"
              style={{background:C.primary+'22',color:C.primary}}>+ إضافة وقت</button>
          </div>

          {/* أيام */}
          <div>
            <div className="text-xs mb-2" style={{color:C.txt2}}>أيام الإرسال</div>
            <div className="flex flex-wrap gap-2">
              {DAYS_AR.map((d,i) => {
                const on = s.reminder_days.includes(i);
                return (
                  <button key={i} onClick={()=>toggleDay(i)}
                    className="px-3 py-1 rounded-xl text-xs font-bold transition-colors"
                    style={{background: on ? C.primary : C.soft, color: on ? '#fff' : C.txt2}}>
                    {d}
                  </button>
                );
              })}
            </div>
          </div>

          {/* العتبة */}
          <div>
            <div className="text-xs mb-2" style={{color:C.txt2}}>أرسل التذكير إذا عدد المسجلين أقل من</div>
            <div className="flex items-center gap-3">
              <input type="number" min="1" max="20" value={s.reminder_threshold}
                onChange={e=>upd({reminder_threshold:parseInt(e.target.value)||1})}
                className="w-20 p-2 rounded-xl text-center text-sm font-bold"
                style={{background:C.soft,color:C.txt,border:`1px solid ${C.border}`}}/>
              <span className="text-xs" style={{color:C.txt2}}>موظف</span>
            </div>
          </div>

          {/* نص الرسالة */}
          <div>
            <div className="text-xs mb-2" style={{color:C.txt2}}>نص الرسالة</div>
            <textarea rows={2} value={s.reminder_message}
              onChange={e=>upd({reminder_message:e.target.value})}
              className="w-full p-3 rounded-xl text-sm resize-none"
              style={{background:C.soft,color:C.txt,border:`1px solid ${C.border}`}}/>
          </div>
        </>}
      </div>

      {/* ── إشعارات أخرى ── */}
      <div className="rounded-2xl p-4" style={{background:C.card,border:`1px solid ${C.border}`}}>
        <div className="text-base font-bold mb-2" style={{color:C.txt}}>إشعارات أخرى</div>
        <Toggle on={s.checkin_notify_enabled} onChange={()=>upd({checkin_notify_enabled:!s.checkin_notify_enabled})} label="إشعار تسجيل الحضور"/>
        <div style={{height:1,background:C.border,margin:'4px 0'}}/>
        <Toggle on={s.boxki_notify_enabled} onChange={()=>upd({boxki_notify_enabled:!s.boxki_notify_enabled})} label="إشعار مطابقة بوكسي"/>
        <div style={{height:1,background:C.border,margin:'4px 0'}}/>
        <Toggle on={s.photo_check_enabled!==false} onChange={()=>upd({photo_check_enabled:s.photo_check_enabled===false})} label="📸 تصوير المحل قبل المطابقة"/>
        <div style={{height:1,background:C.border,margin:'4px 0'}}/>
        <Toggle on={s.task_notify_enabled!==false} onChange={()=>upd({task_notify_enabled:s.task_notify_enabled===false})} label="إشعار إكمال المهام"/>
      </div>

      {/* ── تذكير المهام الصباحي ── */}
      <div className="rounded-2xl p-4 space-y-3" style={{background:C.card,border:`1px solid ${C.border}`}}>
        <div className="text-base font-bold mb-1" style={{color:C.txt}}>📋 تذكير المهام الصباحي</div>
        <Toggle on={s.task_reminder_enabled!==false} onChange={()=>upd({task_reminder_enabled:s.task_reminder_enabled===false})} label="تفعيل تذكير المهام"/>
        {s.task_reminder_enabled!==false&&(
          <div>
            <div className="text-xs mb-2" style={{color:C.txt2}}>وقت إرسال التذكير</div>
            <input type="time" value={s.task_reminder_time||'08:00'}
              onChange={e=>upd({task_reminder_time:e.target.value})}
              className="p-2 rounded-xl text-sm font-bold"
              style={{background:C.soft,color:C.txt,border:`1px solid ${C.border}`}}/>
            <div className="text-xs mt-2" style={{color:C.txt2}}>
              يرسل تبليغ تليغرام في هذا الوقت لكل مهمة مجدولة لهذا اليوم (يومية، أسبوعية، شهرية، مرة واحدة)
            </div>
          </div>
        )}
      </div>

      {/* ── تبليغ سريع ── */}
      <div className="rounded-2xl p-4 space-y-3" style={{background:C.card,border:`1px solid ${C.border}`}}>
        <div className="text-base font-bold" style={{color:C.txt}}>📨 تبليغ سريع</div>
        <div className="text-xs" style={{color:C.txt2}}>أرسل رسالة مباشرة عبر بوت التليغرام</div>
        <textarea rows={3} value={quickMsg} onChange={e=>setQuickMsg(e.target.value)}
          placeholder="اكتب رسالتك هنا..."
          className="w-full p-3 rounded-xl text-sm resize-none"
          style={{background:C.soft,color:C.txt,border:`1px solid ${C.border}`,direction:'rtl'}}/>
        <button onClick={sendQuick} disabled={qBusy||!quickMsg.trim()}
          className="w-full py-3 rounded-xl font-bold text-white text-sm"
          style={{background: qSent ? C.ok : C.primary, opacity: (!quickMsg.trim()&&!qBusy)?0.5:1}}>
          {qBusy?'جار الإرسال...':qSent?'تم الإرسال ✓':'إرسال عبر التليغرام 📤'}
        </button>
      </div>

      {/* ── حفظ ── */}
      <button onClick={save} disabled={saving}
        className="w-full p-4 rounded-2xl font-bold text-white"
        style={{background: saved ? C.ok : C.primary}}>
        {saving ? 'جار الحفظ...' : saved ? 'تم الحفظ ✓' : 'حفظ الإعدادات'}
      </button>
    </div>
  );
}

// ── AUDIT LOG (ADMIN) ─────────────────────────────────────────────────────────
function AuditLogView({employees}) {
  const [tab, setTab] = useState('audit');
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(()=>{
    if(tab!=='audit') return;
    sb.from('audit_log')
      .select('*')
      .order('created_at',{ascending:false})
      .limit(200)
      .then(({data})=>{ setLogs(data||[]); setLoading(false); });
  },[tab]);

  const getEmp = id => employees.find(e=>e.id===id);

  const ACTION = {
    add:   {label:'إضافة',   bg:'var(--ok-bg)', color:C.ok},
    update:{label:'تعديل',   bg:'var(--edit-bg)', color:C.primary},
    delete:{label:'حذف',     bg:'var(--err-bg)', color:C.err},
  };

  const shiftLabel = s => s==='full'?'كامل':'نص';

  const fmtDate = iso => {
    const d=new Date(iso);
    const h=String(d.getHours()).padStart(2,'0');
    const min=String(d.getMinutes()).padStart(2,'0');
    return `${d.getDate()} ${MONTHS[d.getMonth()]} · ${h}:${min}`;
  };

  // Group logs by date (record_date)
  const grouped = logs.reduce((acc,log)=>{
    const key=log.record_date;
    if(!acc[key]) acc[key]=[];
    acc[key].push(log);
    return acc;
  },{});

  return (
    <div className="space-y-4">
      <div className="flex gap-2">
        {[['audit','سجل التعديلات'],['boxki','سجل بوكسي']].map(([v,l])=>(
          <button key={v} onClick={()=>setTab(v)}
            className="flex-1 py-2.5 rounded-xl text-sm font-bold"
            style={{background:tab===v?C.primary:C.soft,color:tab===v?'#fff':C.txt}}>
            {l}
          </button>
        ))}
      </div>

      {tab==='boxki' && <BoxkiLogView employees={employees}/>}

      {tab==='audit' && <>
      {loading && <div className="text-center py-8 text-sm" style={{color:C.txt,opacity:.4}}>جاري التحميل...</div>}

      {!loading && logs.length===0 && (
        <div className="text-center py-12 text-sm" style={{color:C.txt,opacity:.4}}>لا توجد تعديلات بعد</div>
      )}

      {Object.entries(grouped).sort(([a],[b])=>b.localeCompare(a)).map(([date,dayLogs])=>(
        <div key={date}>
          <div className="text-xs font-bold mb-2 px-1" style={{color:C.txt,opacity:.4}}>
            {(()=>{const p=date.split('-');return `${parseInt(p[2])} ${MONTHS[parseInt(p[1])-1]} ${p[0]}`;})()}
          </div>
          <div className="space-y-2">
            {dayLogs.map(log=>{
              const emp    = getEmp(log.employee_id);
              const byEmp  = getEmp(log.changed_by);
              const act    = ACTION[log.action] || ACTION.update;
              return (
                <div key={log.id} className="rounded-2xl p-4 shadow-sm" style={{background:C.card}}>
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                      {/* color dot of affected employee */}
                      {emp && <div className="w-2.5 h-2.5 rounded-full flex-shrink-0 mt-0.5" style={{background:emp.color_hex}}/>}
                      <div className="min-w-0">
                        <div className="font-semibold text-sm truncate" style={{color:C.txt}}>
                          {emp?.name || '—'}
                        </div>
                        <div className="text-xs mt-0.5" style={{color:C.txt,opacity:.5}}>
                          {log.action==='add'    && `${shiftLabel(log.new_shift)} شفت`}
                          {log.action==='update' && `${shiftLabel(log.old_shift)} ← ${shiftLabel(log.new_shift)}`}
                          {log.action==='delete' && `حُذف ${shiftLabel(log.old_shift)} شفت`}
                          {log.is_auto && <span className="mr-1 opacity-60">(تلقائي)</span>}
                        </div>
                      </div>
                    </div>
                    <div className="text-left flex-shrink-0">
                      <span className="text-xs font-bold px-2 py-0.5 rounded-lg" style={{background:act.bg,color:act.color}}>
                        {act.label}
                      </span>
                    </div>
                  </div>
                  <div className="flex items-center justify-between mt-3 pt-2" style={{borderTop:`1px solid ${C.soft}`}}>
                    <div className="text-xs" style={{color:C.primary,opacity:.8}}>
                      {byEmp ? `بواسطة: ${byEmp.name}` : '—'}
                    </div>
                    <div className="text-xs" style={{color:C.txt,opacity:.35}}>
                      {fmtDate(log.created_at)}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      </>}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [session,setSession]=useState(undefined);
  const [me,setMe]=useState(null);
  const [employees,setEmployees]=useState([]);
  const [settings,setSettings]=useState(null);
  const [tab,setTab]=useState('calendar');
  const [dark,setDark]=useState(()=>localStorage.getItem('dark')==='1');
  const [attendanceBanner,setAttendanceBanner]=useState(false);

  const toggleDark = () => {
    const next=!dark;
    setDark(next);
    document.documentElement.classList.toggle('dark',next);
    localStorage.setItem('dark',next?'1':'0');
  };

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session:s}})=>{
      setSession(s);
      if(s) loadData(s);
      else setSession(null);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>{
      setSession(s);
      if(s) loadData(s);
      else {setMe(null);setEmployees([]);}
    });
    return ()=>subscription.unsubscribe();
  },[]);

  const loadData = async s => {
    const [{data:emps},{data:sets}]=await Promise.all([
      sb.from('employees').select('*'),
      sb.from('settings').select('*').order('effective_from',{ascending:false}).limit(1).maybeSingle()
    ]);
    const all=emps||[];
    setEmployees(all);
    const myEmp=all.find(e=>e.auth_user_id===s.user.id)||null;
    setMe(myEmp);
    setSettings(sets);
    // Check attendance reminder
    if(myEmp && myEmp.role!=='admin') {
      const today=todayStr();
      const {data:todayRec}=await sb.from('attendance_records').select('id').eq('employee_id',myEmp.id).eq('date',today).maybeSingle();
      const h=iraqNow().getUTCHours();
      if(!todayRec && h>=8 && h<22) setAttendanceBanner(true);
    }
  };

  const logout = async () => {
    await sb.auth.signOut();
    setMe(null); setSession(null); setTab('calendar'); setAttendanceBanner(false);
  };

  if(session===undefined) return (
    <div className="min-h-screen flex items-center justify-center" style={{background:C.bg}}>
      <div className="text-center">
        <div className="w-14 h-14 rounded-2xl mx-auto mb-3 flex items-center justify-center font-black text-xl text-white" style={{background:C.primary}}>S</div>
        <div className="text-sm" style={{color:C.txt,opacity:.4}}>جاري التحميل...</div>
      </div>
    </div>
  );

  if(!session||!me) return <AuthScreen/>;

  const isAdmin=me.role==='admin';
  const tabs=[
    {id:'calendar',label:'التقويم',icon:'calendar'},
    {id:'dashboard',label:'الرئيسية',icon:'home'},
    ...(isAdmin?[
      {id:'payslips',label:'الرواتب',icon:'file'},
      {id:'employees',label:'الموظفون',icon:'user'},
      {id:'audit',label:'السجل',icon:'clock'},
      {id:'notif',label:'الإشعارات',icon:'bell'},
    ]:[]),
  ];

  return (
    <div className="min-h-screen" style={{background:C.bg}}>
      {/* Header */}
      <div className="shadow-sm px-4 py-3 flex items-center justify-between sticky top-0 z-40"
        style={{background:C.card}}>
        <div className="flex items-center gap-3">
          {me.avatar_id!=null&&AVATARS[me.avatar_id]?(
            <img src={AVATARS[me.avatar_id]} style={{width:32,height:32,borderRadius:10,objectFit:'cover',display:'block'}}/>
          ):(
            <div className="w-8 h-8 rounded-xl flex items-center justify-center font-black text-sm text-white" style={{background:C.primary}}>S</div>
          )}
          <div>
            <div className="text-xs font-black tracking-widest leading-none" style={{color:C.primary}}>STACKS</div>
            <div className="text-xs leading-none mt-0.5" style={{color:C.txt,opacity:.45}}>{me.name}</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          {isAdmin&&<span className="text-xs px-2 py-1 rounded-lg font-semibold" style={{background:'var(--badge-bg)',color:C.primary}}>مدير</span>}
          <button onClick={toggleDark} className="p-2 rounded-xl" style={{background:C.soft}}>
            <Ic n={dark?'sun':'moon'} s={17} c={C.primary}/>
          </button>
          <button onClick={logout} className="p-2 rounded-xl" style={{background:C.soft}}>
            <Ic n="logout" s={17} c={C.err}/>
          </button>
        </div>
      </div>

      {/* Attendance banner */}
      {attendanceBanner && (
        <div className="mx-4 mt-4 p-3 rounded-2xl flex items-center justify-between"
          style={{background:'var(--edit-bg)'}}>
          <div className="flex items-center gap-2">
            <Ic n="bell" s={16} c={C.primary}/>
            <span className="text-sm font-semibold" style={{color:C.primary}}>لم تسجل حضورك اليوم بعد</span>
          </div>
          <button onClick={()=>{setAttendanceBanner(false);setTab('calendar');}}
            className="text-xs font-bold px-3 py-1 rounded-lg text-white"
            style={{background:C.primary}}>
            سجّل الآن
          </button>
        </div>
      )}

      {/* Page content */}
      <div className="p-4 max-w-lg mx-auto pb-24">
        {tab==='calendar'&&<CalendarView me={me} employees={employees} isAdmin={isAdmin} settings={settings}/>}
        {tab==='dashboard'&&!isAdmin&&<EmpDashboard me={me} employees={employees} settings={settings} onRefresh={()=>loadData(session)}/>}
        {tab==='dashboard'&&isAdmin&&<AdminDashboard employees={employees} settings={settings} me={me} onRefresh={()=>loadData(session)}/>}
        {tab==='payslips'&&isAdmin&&<PayslipsView employees={employees} settings={settings}/>}
        {tab==='employees'&&isAdmin&&<EmployeesView employees={employees} settings={settings} onRefresh={()=>loadData(session)}/>}
        {tab==='audit'&&isAdmin&&<AuditLogView employees={employees}/>}
        {tab==='notif'&&isAdmin&&<NotificationSettingsView/>}
      </div>

      {/* Bottom nav */}
      <div className="fixed bottom-0 inset-x-0 border-t" style={{background:C.card,borderColor:C.border}}>
        <div className="flex max-w-lg mx-auto">
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)}
              className="flex-1 py-3 flex flex-col items-center gap-0.5 transition-colors"
              style={{color:tab===t.id?C.primary:'var(--muted)'}}>
              <Ic n={t.icon} s={22} c={tab===t.id?C.primary:'var(--muted)'}/>
              <span className="text-xs font-semibold">{t.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
